# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

marketplace_homepage:
    path: /
    controller: App\Controller\MarketplaceController::homepage

marketplace_index:
    path: /browse
    controller: App\Controller\MarketplaceController::index

marketplace_upload_package:
    path: /upload/package
    controller: App\Controller\MarketplaceController::uploadPackage

profile_page:
    path: /profile
    controller: App\Controller\ProfileController::index

marketplace_stripe_connect_onboard:
    path: /stripe/connect/onboard
    controller: App\Controller\StripeConnectController::onboard
    methods: [GET]

marketplace_stripe_connect_return:
    path: /stripe/connect/return
    controller: App\Controller\StripeConnectController::onboardingReturn
    methods: [GET]

marketplace_stripe_connect_refresh:
    path: /stripe/connect/refresh
    controller: App\Controller\StripeConnectController::refresh
    methods: [GET]

review_submit:
    path: /package/{package}/review
    controller: App\Controller\ReviewController::submit
    methods: [POST]
    requirements:
        package: .+

api_package_parse_composer:
    path: /api/package/parse-composer
    controller: App\Controller\Api\ParseComposerApiController::parse
    methods: [POST]

api_package_submit:
    path: /api/package/submit
    controller: App\Controller\Api\SubmitApiController::submit
    methods: [POST]

api_package_mautic_upload:
    path: /api/package/mautic-upload
    controller: App\Controller\Api\MauticUploadApiController::upload
    methods: [POST]

api_mautic_versions:
    path: /api/mautic-versions
    controller: App\Controller\Api\MauticVersionsApiController::list
    methods: [GET]

api_categories:
    path: /api/categories
    controller: App\Controller\Api\CategoriesApiController::list
    methods: [GET]

api_package_submission_status:
    path: /api/package/{package}/submission-status
    controller: App\Controller\Api\SubmissionStatusApiController::status
    methods: [GET]
    requirements:
        package: .+

package_upload:
    path: /api/package/upload
    controller: App\Controller\Api\UploadApiController::upload
    methods: [POST]

publish_upload:
    path: /publish/upload
    controller: App\Controller\PublishController::upload
    methods: [GET]

marketplace_stripe_webhook:
    path: /stripe/webhook
    controller: App\Controller\StripeCheckoutController::webhook
    methods: [POST]

# Must precede marketplace_detail: its greedy {package} would otherwise swallow these.
marketplace_package_download:
    path: /package/{package}/download
    controller: App\Controller\MarketplaceController::download
    methods: [GET]
    requirements:
        package: .+

marketplace_stripe_checkout_buy:
    path: /package/{package}/buy
    controller: App\Controller\StripeCheckoutController::buy
    methods: [GET]
    requirements:
        package: .+

marketplace_stripe_checkout_success:
    path: /package/{package}/purchase/success
    controller: App\Controller\StripeCheckoutController::success
    methods: [GET]
    requirements:
        package: .+

marketplace_stripe_checkout_cancel:
    path: /package/{package}/purchase/cancel
    controller: App\Controller\StripeCheckoutController::cancel
    methods: [GET]
    requirements:
        package: .+

marketplace_detail:
    path: /package/{package}
    controller: App\Controller\MarketplaceController::detail
    requirements:
        package: .+
