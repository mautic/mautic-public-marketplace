mautic.marketplace.detail.install_instructions.theme.standard_upload.heading="This is the easiest way to add a theme for emails, landing pages, or forms."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.1="**Log in** to your Mautic instance."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.2="Click the **Settings** menu in the top-right corner."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.3="Select `Themes` from the menu."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.4="In the top-right corner of the Themes page, click `Choose File`."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.5="Select your theme's `.zip` file from your computer."
mautic.marketplace.detail.install_instructions.theme.standard_upload.step.6="Click `Install`."
mautic.marketplace.detail.install_instructions.theme.manual_upload.heading="If the web uploader gives you a \"File too large\" or \"Invalid package\" error, you can do it manually via your server."
mautic.marketplace.detail.install_instructions.theme.manual_upload.step.1="**Unzip** your theme folder on your local computer."
mautic.marketplace.detail.install_instructions.theme.manual_upload.step.2="Connect to your server via **FTP** or use your hosting **File Manager**."
mautic.marketplace.detail.install_instructions.theme.manual_upload.step.3="Navigate to your Mautic root directory and open the `/themes/` folder."
mautic.marketplace.detail.install_instructions.theme.manual_upload.step.4="Upload your theme folder directly into this directory (e.g., `/themes/my-custom-theme/`)."
mautic.marketplace.detail.install_instructions.theme.manual_upload.step.5="**Clear your Mautic cache** for the new theme to appear in the interface."
mautic.marketplace.detail.install_instructions.marketplace="Marketplace command"
mautic.marketplace.detail.install_instructions.plugin.marketplace.heading="Use this method to install plugins directly from the Mautic Marketplace using the built-in CLI command."
mautic.marketplace.detail.install_instructions.plugin.marketplace.step.1="**Open your terminal** and navigate to your Mautic root directory."
mautic.marketplace.detail.install_instructions.plugin.marketplace.step.2="Run the following command to install the plugin: `%command%`"
mautic.marketplace.detail.install_instructions.plugin.marketplace.step.3="Go to **Settings > Plugins** in the Mautic UI."
mautic.marketplace.detail.install_instructions.plugin.marketplace.step.4="Find it on the screen and click to configure the plugin."
mautic.marketplace.detail.install_instructions.plugin.composer.heading="If your Mautic was installed via Composer, use it to manage plugins so dependencies are handled correctly."
mautic.marketplace.detail.install_instructions.plugin.composer.step.1="**Open your terminal** and navigate to your Mautic root directory."
mautic.marketplace.detail.install_instructions.plugin.composer.step.2="**Require the plugin package**: `%command%`"
mautic.marketplace.detail.install_instructions.plugin.composer.step.3="**Clear the cache** so Mautic can detect the new code: `%command%`"
mautic.marketplace.detail.install_instructions.plugin.composer.step.4="Go to **Settings > Plugins** in the Mautic UI."
mautic.marketplace.detail.install_instructions.plugin.composer.step.5="Find it on the screen and click to configure the plugin."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.heading="Use this for third-party plugins that are not available on Composer or when your Mautic instance uses the standard production package."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.step.1="**Download and unzip** the plugin."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.step.2="**Rename the folder** so it matches the internal bundle name, for example `MauticRecaptchaBundle` or `CustomObjectBundle`."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.step.3="**Upload the folder** to the `/plugins/` directory of your Mautic installation, for example `/var/www/mautic/plugins/MyCustomPluginBundle/`."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.step.4="Go to **Settings > Plugins** and click `Install/Upgrade Plugins`."
mautic.marketplace.detail.install_instructions.plugin.manual_upload.step.5="Once done, find it on the screen and click to configure the plugin."
mautic.marketplace.detail.install_instructions.resource.import.tab="Import resource"
mautic.marketplace.detail.install_instructions.resource.import.heading="Import the campaign package together with any included emails, forms, and landing pages."
mautic.marketplace.detail.install_instructions.resource.import.step.1="Download the campaign `.zip` file."
mautic.marketplace.detail.install_instructions.resource.import.step.2="**Log in** to your Mautic instance."
mautic.marketplace.detail.install_instructions.resource.import.step.3="Navigate to **Campaigns** in the left-hand sidebar."
mautic.marketplace.detail.install_instructions.resource.import.step.4="In the top-right corner, click the **cog icon next to New** and select `Import`."
mautic.marketplace.detail.install_instructions.resource.import.step.5="Click `Choose File`, select your resource package, and click `Upload`."
mautic.marketplace.detail.install_instructions.resource.import.step.6="Review the detected custom fields, segments, or tags. For missing items, choose whether to **Auto-create** them or **Update** an existing item."
mautic.marketplace.detail.install_instructions.resource.import.step.7="Once done, click `Proceed`."
